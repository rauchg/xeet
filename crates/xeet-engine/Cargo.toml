[package]
name = "xeet-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The representation engine as a provider: transport-independent capability contracts, a versioned manifest, discovery and modality negotiation, per-invocation authority, and verifiable outcomes. MCP and the CLI are transports over it."

[dependencies]
xeet-artifact = { path = "../xeet-artifact" }
xeet-capture = { path = "../xeet-capture" }
xeet-core = { path = "../xeet-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
