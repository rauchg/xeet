[workspace]
resolver = "2"
members = ["crates/xeet-core", "crates/xeet-text", "crates/xeet-resolve", "crates/xeet-resolve-net", "crates/xeet-cli", "crates/xeet-wasm", "crates/xeet-artifact", "crates/xeet-capture", "crates/xeet-engine", "crates/xeet-gateway", "crates/xeet-ocr"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/rauchg/xeet"
homepage = "https://xeet-rs.vercel.app"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Optimized but quick to build; for iterating against the oracle.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[profile.dev.package."*"]
opt-level = 2
